[[source]]
id          = "acebasic"
name        = "ACE BASIC"
description = "ACE BASIC compiler, upstream release the AmiDevIDE patch series applies to."
resolver    = "static"
url         = "https://github.com/mdbergmann/ACEBasic/archive/refs/tags/3.0.1.tar.gz"
filename    = "ACEBasic-3.0.1.tar.gz"
version     = "3.0.1"
patterns    = ["ACEBasic-3.0.1.tar.gz"]
homepage    = "https://github.com/mdbergmann/ACEBasic"
notes       = "Pinned: compilers/acebasic/patches/ only apply to this exact tag. acd_ace.py checks the sha256 and applies them."
