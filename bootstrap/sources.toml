# External sources AmiDevIDE builds or installs from.
#
# Everything listed here is fetched into var/downloads/ by acd_fetch.py.  You
# can also drop the archives in there by hand -- see docs/SOURCES.html, which
# is generated from this file -- and the fetcher will use them as they are.
#
# resolver:
#   static        url is fixed.  version is given, or read off version_page.
#   manual        url is a page with a download form; never fetched, only
#                 used if someone put the archive into var/downloads/.
#   vbcc_tag      scrape the vbcc page for the highest vbccX_Ytag source archive
#   vbcc_target   scrape the vbcc page for the newest dated target archive

[[source]]
id          = "vasm"
name        = "vasm"
description = "Portable and retargetable assembler, source release."
resolver    = "static"
url         = "http://sun.hasenbraten.de/vasm/release/vasm.tar.gz"
filename    = "vasm.tar.gz"
patterns    = ["vasm*.tar.gz"]
homepage    = "http://sun.hasenbraten.de/vasm/"
version_page  = "http://sun.hasenbraten.de/vasm/index.php?view=relsrc"
version_regex = "Download the\\s+v([0-9A-Za-z.]+)"
notes       = "This URL always serves the current release, so no scraping needed."

[[source]]
id          = "vlink"
name        = "vlink"
description = "Portable linker for multiple file formats, source release."
resolver    = "static"
url         = "http://sun.hasenbraten.de/vlink/release/vlink.tar.gz"
filename    = "vlink.tar.gz"
patterns    = ["vlink*.tar.gz"]
homepage    = "http://sun.hasenbraten.de/vlink/"
version_page  = "http://sun.hasenbraten.de/vlink/index.php?view=relsrc"
version_regex = "Download the\\s+v([0-9A-Za-z.]+)"
notes       = "This URL always serves the current release, so no scraping needed."

[[source]]
id          = "vbcc"
name        = "vbcc"
description = "The vbcc C compiler, full release source."
resolver    = "vbcc_tag"
page        = "http://sun.hasenbraten.de/vbcc/"
patterns    = ["vbcc*.tar.gz", "vbcc*.zip"]
homepage    = "http://sun.hasenbraten.de/vbcc/"
notes       = "There is no 'latest' URL; the newest vbccX_Y[Pn].tar.gz under phoenix.owl.de/tags/ wins."

[[source]]
id          = "vbcc_target_m68k"
name        = "vbcc target m68k-amigaos"
description = "Prebuilt vbcc C runtime for AmigaOS 2.x/3.x M680x0 (headers + libs)."
resolver    = "vbcc_target"
page        = "http://sun.hasenbraten.de/vbcc/"
filename    = "vbcc_target_m68k-amigaos.lha"
patterns    = ["vbcc_target_m68k-amigaos.lha"]
homepage    = "http://sun.hasenbraten.de/vbcc/"
notes       = "The one component not built from source -- it ships as a binary runtime."

[[source]]
id          = "ndk32"
name        = "NDK 3.2"
description = "Amiga Native Developer Kit 3.2: includes, FD/SFD, linker libs, autodocs."
resolver    = "static"
url         = "https://aminet.net/dev/misc/NDK3.2.lha"
filename    = "NDK3.2.lha"
patterns    = ["NDK3.2*.lha", "NDK_3.2*.lha"]
homepage    = "https://aminet.net/package/dev/misc/NDK3.2"

[[source]]
id          = "mui38"
name        = "MUI 3.8 developer"
description = "MagicUserInterface 3.8 developer files: includes, FD, autodocs, examples."
resolver    = "static"
url         = "https://aminet.net/dev/mui/mui38dev.lha"
filename    = "mui38dev.lha"
patterns    = ["mui38dev*.lha"]
homepage    = "https://aminet.net/package/dev/mui/mui38dev"
notes       = "Archive root is MUI/, installed as sdk/MUI_3.8/."

[[source]]
id          = "mcc_nlist"
name        = "MCC NList"
description = "MUI custom classes NList, NListview, NListtree, NFloattext: includes and autodocs."
resolver    = "static"
url         = "https://github.com/amiga-mui/nlist/releases/download/0.128/MCC_NList-0.128.lha"
filename    = "MCC_NList-0.128.lha"
version     = "0.128"
patterns    = ["MCC_NList-*.lha"]
homepage    = "https://github.com/amiga-mui/nlist"
notes       = "LGPL 2.1. Developer/ is merged into sdk/MCC/ together with TextEditor."

[[source]]
id          = "mcc_texteditor"
name        = "MCC TextEditor"
description = "MUI custom class TextEditor: include and autodoc."
resolver    = "static"
url         = "https://github.com/amiga-mui/texteditor/releases/download/15.56/MCC_TextEditor-15.56.lha"
filename    = "MCC_TextEditor-15.56.lha"
version     = "15.56"
patterns    = ["MCC_TextEditor-*.lha"]
homepage    = "https://github.com/amiga-mui/texteditor"
notes       = "LGPL 2.1. Developer/ is merged into sdk/MCC/ together with NList."

[[source]]
id          = "reqtools_dev"
name        = "ReqTools developer"
description = "reqtools.library 2.9 developer files: includes, FD, autodoc."
resolver    = "static"
url         = "https://aminet.net/util/libs/ReqToolsDev.lha"
filename    = "ReqToolsDev.lha"
version     = "2.9"
patterns    = ["ReqToolsDev*.lha"]
homepage    = "https://aminet.net/package/util/libs/ReqToolsDev"
notes       = "Archive root is ReqTools/; include/, fd/ and doc/ are installed as sdk/reqtools/."

[[source]]
id          = "regex_ranieri"
name        = "regex.library (Ranieri)"
description = "POSIX 1003.2 regex.library 5.1 by Alfonso Ranieri: includes, FD, docs."
resolver    = "static"
url         = "https://aminet.net/util/libs/regex_ranieri.lha"
filename    = "regex_ranieri.lha"
version     = "5.1"
patterns    = ["regex_ranieri*.lha"]
homepage    = "https://aminet.net/package/util/libs/regex_ranieri"
notes       = "NOT util/libs/Regex.lha (an unrelated GNU regex.library 1.0). Archive root is regex/; SASCinclude/ is installed as sdk/regex/include/, fd/ and Docs/ as they are."

[[source]]
id          = "amissl_sdk"
name        = "AmiSSL v5 SDK"
description = "AmiSSL v5 (OpenSSL 3.x) developer files: includes, AmigaOS3 link libraries, FD/SFD, autodocs."
resolver    = "static"
url         = "https://aminet.net/util/libs/AmiSSL-v5-SDK.lha"
filename    = "AmiSSL-v5-SDK.lha"
version     = "5.27"
patterns    = ["AmiSSL-v5*-SDK.lha"]
homepage    = "https://aminet.net/package/util/libs/AmiSSL-v5-SDK"
notes       = "Archive root is AmiSSL/; Developer/ (without examples and OS4 libs) is installed as sdk/AmiSSL-v5/. Aminet replaces the file in place on every 5.x update, so a new upload changes the checksum."

[[source]]
id          = "posixlib"
name        = "vbcc PosixLib"
description = "POSIX compatibility library for vbcc 3.0 (Frank Wille): includes and the AmigaOS3 posix.lib."
resolver    = "static"
url         = "https://aminet.net/dev/c/vbcc_PosixLib.lha"
filename    = "vbcc_PosixLib.lha"
version     = "3.0"
patterns    = ["vbcc_PosixLib*.lha"]
homepage    = "https://aminet.net/package/dev/c/vbcc_PosixLib"
notes       = "Archive root is PosixLib/; include/ and AmigaOS3/ are installed as sdk/PosixLib/."

[[source]]
id          = "sqlite3"
name        = "SQLite 3 (Amiga)"
description = "SQLite 3.34.0 for Amiga (Steffen Gutmann): source tree with the native AmigaOS VFS (os_amiga.c)."
resolver    = "static"
url         = "https://aminet.net/biz/dbase/sqlite-3.34.0.a-amiga.lha"
filename    = "sqlite-3.34.0.a-amiga.lha"
version     = "3.34.0.a"
patterns    = ["sqlite-3.34.0.a-amiga.lha"]
homepage    = "https://aminet.net/package/biz/dbase/sqlite-3.34.0.a-amiga"
notes       = "22 MB. acd_sqlite.py builds sdk/SQLite3/ from it with vbcc (needs tclsh); the bundled libsqlite3.a is built with gcc 3.4.0 and is not installed."

[[source]]
id          = "roadshow_sdk"
name        = "Roadshow SDK"
description = "Roadshow TCP/IP stack SDK 1.8 (Olaf Barthel): include/, netinclude/, sfd/, docs."
resolver    = "manual"
url         = "https://www.amigafuture.de/app.php/dlext/details?df_id=3658"
filename    = "Roadshow-SDK-1.8.lha"
version     = "1.8"
patterns    = ["Roadshow-SDK-*.lha"]
homepage    = "https://roadshow.apc-tcp.de"
notes       = "Amiga Future serves it through a download form, so it cannot be fetched automatically: download Roadshow-SDK-1.8.lha there and put it into var/downloads/. Without it, NDK 3.2's SANA+RoadshowTCP-IP/netinclude is an alternative."

[[source]]
id          = "acebasic"
name        = "ACE BASIC"
description = "ACE BASIC compiler, upstream release the AmiDevIDE patch series applies to."
resolver    = "static"
url         = "https://github.com/mdbergmann/ACEBasic/archive/refs/tags/3.0.1.tar.gz"
filename    = "ACEBasic-3.0.1.tar.gz"
version     = "3.0.1"
patterns    = ["ACEBasic-3.0.1.tar.gz"]
homepage    = "https://github.com/mdbergmann/ACEBasic"
notes       = "Pinned: compilers/acebasic/patches/ only apply to this exact tag. acd_ace.py checks the sha256 and applies them."
